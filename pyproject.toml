# 仓库级工具链配置，唯一事实来源：ruff / mypy / pytest。
# 业务包元数据与运行依赖在 project/pyproject.toml，两者互不干涉。
# 本项目不配置 CI，以下配置供本地质量门使用。

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["project/src", "project/tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["project/src"]
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# torch / FlagEmbedding / pymilvus 等运行依赖不带类型存根，
# 未单独安装 stub 前不做缺库告警。
module = ["torch.*", "FlagEmbedding.*", "pymilvus.*", "transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["project/tests"]
pythonpath = ["project/src"]
addopts = "-q"
