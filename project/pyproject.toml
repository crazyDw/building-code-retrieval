# 业务包元数据与运行依赖。工具链配置（ruff / mypy / pytest）在仓库根 pyproject.toml。
# torch 不写入 dependencies：必须显式指定 cu126 索引手动安装（见 AGENTS.md 铁律 19）。

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archrag"
version = "0.1.0"
description = "建筑规范 RAG 智能检索助手"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142,<1",
    "uvicorn>=0.54,<1",
    "pymilvus>=2.5,<4",
    "FlagEmbedding>=1.4,<2",
    "transformers>=5.18,<6",
    "langchain-deepseek>=1.1,<2",
    "langchain-core>=1.6,<2",
    "python-dotenv>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.16,<1",
    "mypy>=2.4,<3",
    "httpx>=0.28,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
